<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary">Novo pedido</a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente ID</th>
                        <th>Itens</th>
                        <th>Responsável</th>
                        <th>Entrada</th>
                        <th>Responsável saída</th>
                        <th>Saída</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="9" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>
                        <td>
                            <span th:if="${pedido.itens == null or pedido.itens.isEmpty()}"
                                  th:text="${(pedido.tipoPizza != null ? pedido.tipoPizza : '') + ' / ' + (pedido.sabor != null ? pedido.sabor : '') + ' x' + pedido.quantidade}"></span>
                            <ul th:if="${pedido.itens != null and !pedido.itens.isEmpty()}" class="mb-0">
                                <li th:each="item : ${pedido.itens}"
                                    th:text="${item.quantidade + 'x ' + item.nome + ' (R$ ' + item.preco + ')'}"></li>
                            </ul>
                        </td>
                        <td th:text="${pedido.responsavelEntrada}"></td>
                        <td th:text="${pedido.dataEntrada}"></td>
                        <td th:text="${pedido.responsavelSaida}"></td>
                        <td th:text="${pedido.dataSaida}"></td>
                        <td th:text="${pedido.valorTotal}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'ENTREGUE'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                            <form th:if="${pedido.status == 'RECEBIDO'}"
                                th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                                <input type="hidden" name="status" value="EM_PREPARACAO"/>
                                <button type="submit" class="btn btn-sm btn-warning">Enviar à cozinha</button>
                            </form>
                            <form th:if="${pedido.status == 'EM_PREPARACAO'}"
                                th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                                <input type="hidden" name="status" value="PRONTO"/>
                                <button type="submit" class="btn btn-sm btn-warning">Pronto</button>
                            </form>
                            <form th:if="${pedido.status == 'PRONTO'}"
                                th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                                <input type="hidden" name="status" value="SAIU_PARA_ENTREGA"/>
                                <button type="submit" class="btn btn-sm btn-primary">Saiu para entrega</button>
                            </form>
                            <form th:if="${pedido.status == 'PRONTO'}"
                                th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                                <input type="hidden" name="status" value="RETIRADO"/>
                                <button type="submit" class="btn btn-sm btn-info">Retirado</button>
                            </form>
                            <form th:if="${pedido.status == 'SAIU_PARA_ENTREGA' or pedido.status == 'RETIRADO'}"
                                th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="d-inline">
                                <input type="hidden" name="status" value="FINALIZADO"/>
                                <button type="submit" class="btn btn-sm btn-success">Finalizar</button>
                            </form>

                            <div sec:authorize="hasRole('GERENTE')"
                                 th:if="${pedido.status == 'RECEBIDO' or pedido.status == 'EM_PREPARACAO' or pedido.status == 'PRONTO'}"
                                 class="d-flex flex-column gap-2 mt-2" style="min-width: 220px;">
                                <form th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}" method="post"
                                      class="d-flex gap-1">
                                    <input type="number" name="desconto" min="0.01" max="20" step="0.01"
                                           class="form-control form-control-sm" placeholder="%" required
                                           style="width: 72px;"/>
                                    <button type="submit" class="btn btn-sm btn-success text-nowrap">
                                        <i class="bi bi-percent"></i> Desconto
                                    </button>
                                </form>
                                <form th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post"
                                      class="d-flex gap-1">
                                    <input type="text" name="justificativa" placeholder="Justificativa"
                                           class="form-control form-control-sm" required/>
                                    <button type="submit" class="btn btn-sm btn-outline-danger text-nowrap">
                                        <i class="bi bi-x-circle"></i> Cancelar
                                    </button>
                                </form>
                            </div>
                            <small class="d-block" th:if="${pedido.status == 'CANCELADO'}"
                                th:text="${pedido.justificativaCancelamento}"></small>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>
