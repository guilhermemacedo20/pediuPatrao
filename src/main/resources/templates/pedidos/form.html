<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/pedidos" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Novo pedido</h2>
    </div>

    <div class="card shadow-sm" style="max-width: 640px;">
        <div class="card-body p-4">
            <form th:action="@{/pedidos/salvar}" th:object="${pedido}" method="post">

                <div class="mb-3">
                    <label for="clienteId" class="form-label fw-medium">
                        <i class="bi bi-person me-1"></i>Cliente
                    </label>
                    <select id="clienteId" class="form-select" th:field="*{clienteId}" required>
                        <option value="" disabled>Selecione um cliente</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                    <div class="form-text" th:if="${clientes == null or #lists.isEmpty(clientes)}">
                        Nenhum cliente cadastrado.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="produtoId" class="form-label fw-medium">
                        <i class="bi bi-basket me-1"></i>Produto
                    </label>
                    <select id="produtoId" class="form-select" th:field="*{itens[0].id}" required>
                        <option value="" disabled>Selecione um produto</option>
                        <option th:each="p : ${produtos}" th:value="${p.id}"
                                th:text="${p.nome + ' — R$ ' + p.preco}"></option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="quantidade" class="form-label fw-medium">
                        <i class="bi bi-123 me-1"></i>Quantidade
                    </label>
                    <input id="quantidade" type="number" min="1" required class="form-control"
                           style="max-width: 140px;" th:field="*{itens[0].quantidade}"/>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>Registrar pedido
                    </button>
                    <a href="/pedidos" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</div>
